server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- security headers (apply to every response in this server) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    # The SPA is same-origin with the API (proxied at /api), so connect-src
    # 'self' is enough. 'unsafe-inline' for styles because the UI uses inline
    # style props; add HSTS at the TLS terminator once HTTPS is enabled.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → Laravel backend (agent chat can take minutes on a local LLM)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 660s;
        client_max_body_size 20m;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
