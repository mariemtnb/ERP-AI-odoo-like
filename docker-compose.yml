name: erp-ai

services:
  db:
    # postgres 16 + pgvector extension (RAG embeddings); drop-in replacement.
    image: pgvector/pgvector:pg16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend-laravel.Dockerfile
    env_file: .env
    environment:
      # artisan serve is single-threaded by default; the AI agent's tool calls
      # re-enter this API mid-request, so we need parallel workers.
      PHP_CLI_SERVER_WORKERS: 8
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # php -S directly (not artisan serve): artisan doesn't forward
    # PHP_CLI_SERVER_WORKERS, and the AI agent needs concurrent requests.
    command: >
      sh -c "php artisan migrate --force &&
             cd public &&
             php -S 0.0.0.0:8000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"

  ollama:
    image: ollama/ollama:latest
    dns:
      - 8.8.8.8
      - 1.1.1.1
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ai-service:
    build: ./ai-service
    env_file: .env
    volumes:
      - ./ai-service:/app
    ports:
      - "8001:8001"
    depends_on:
      - ollama
      - backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  frontend:
    build: ./frontend
    env_file: .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
  ollama_data:
