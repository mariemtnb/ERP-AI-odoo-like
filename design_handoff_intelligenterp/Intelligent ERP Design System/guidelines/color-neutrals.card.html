<!-- @dsCard group="Colors" viewport="700x180" name="Charcoal neutrals" subtitle="Warm charcoal surface & text ramp" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-app);font-family:var(--font-sans);padding:24px;display:flex;flex-wrap:wrap;gap:8px}
.sw{width:calc(20% - 7px);height:60px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle);display:flex;align-items:flex-end;padding:7px}
.sw span{font:500 10px/1 var(--font-mono)}</style></head>
<body>
<div class="sw" style="background:var(--charcoal-950)"><span style="color:#888">950 app</span></div>
<div class="sw" style="background:var(--charcoal-900)"><span style="color:#888">900 surface</span></div>
<div class="sw" style="background:var(--charcoal-850)"><span style="color:#999">850 card</span></div>
<div class="sw" style="background:var(--charcoal-800)"><span style="color:#999">800 hover</span></div>
<div class="sw" style="background:var(--charcoal-700)"><span style="color:#aaa">700 border</span></div>
<div class="sw" style="background:var(--charcoal-500)"><span style="color:#111">500 muted</span></div>
<div class="sw" style="background:var(--charcoal-300)"><span style="color:#111">300 body</span></div>
<div class="sw" style="background:var(--charcoal-100)"><span style="color:#111">100 strong</span></div>
<div class="sw" style="background:var(--charcoal-50)"><span style="color:#111">50 hi</span></div>
</body></html>
