<!-- @dsCard group="Colors" viewport="700x140" name="Semantic status" subtitle="Success, warning, danger, info tints" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-app);font-family:var(--font-sans);padding:24px;display:flex;gap:12px}
.chip{flex:1;border-radius:var(--radius-md);padding:14px;display:flex;flex-direction:column;gap:8px}
.dot{width:14px;height:14px;border-radius:99px}
.lbl{font:600 12px/1 var(--font-sans)}.sub{font:400 11px/1 var(--font-mono);color:var(--text-faint)}</style></head>
<body>
<div class="chip" style="background:var(--success-quiet)"><div class="dot" style="background:var(--success)"></div><span class="lbl" style="color:var(--success)">Success</span><span class="sub">emerald-400</span></div>
<div class="chip" style="background:var(--warning-quiet)"><div class="dot" style="background:var(--warning)"></div><span class="lbl" style="color:var(--warning)">Warning</span><span class="sub">amber-400</span></div>
<div class="chip" style="background:var(--danger-quiet)"><div class="dot" style="background:var(--danger)"></div><span class="lbl" style="color:var(--danger)">Danger</span><span class="sub">rose-400</span></div>
<div class="chip" style="background:var(--info-quiet)"><div class="dot" style="background:var(--info)"></div><span class="lbl" style="color:var(--info)">Info</span><span class="sub">sky-400</span></div>
</body></html>
