<!-- @dsCard group="Spacing" viewport="700x170" name="Radius & elevation" subtitle="Corner radii and soft shadow ramp" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-app);font-family:var(--font-sans);padding:24px;display:flex;gap:22px;align-items:center}
.box{width:96px;height:96px;background:var(--surface-card);border:1px solid var(--border-subtle);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
.l{font:500 10px/1 var(--font-mono);color:var(--text-faint)}</style></head>
<body>
<div class="box" style="border-radius:var(--radius-sm);box-shadow:var(--shadow-xs),var(--hairline)"><span class="l">sm · xs</span></div>
<div class="box" style="border-radius:var(--radius-md);box-shadow:var(--shadow-sm),var(--hairline)"><span class="l">md · sm</span></div>
<div class="box" style="border-radius:var(--radius-lg);box-shadow:var(--shadow-md),var(--hairline)"><span class="l">lg · md</span></div>
<div class="box" style="border-radius:var(--radius-xl);box-shadow:var(--shadow-lg),var(--hairline)"><span class="l">xl · lg</span></div>
<div class="box" style="border-radius:var(--radius-xl);box-shadow:var(--shadow-accent)"><span class="l">glow</span></div>
</body></html>
