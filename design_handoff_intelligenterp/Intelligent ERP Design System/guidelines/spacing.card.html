<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base grid" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-app);font-family:var(--font-sans);padding:24px;display:flex;align-items:flex-end;gap:14px}
.c{display:flex;flex-direction:column;align-items:center;gap:8px}
.bar{background:var(--emerald-500);border-radius:3px;width:100%}
.l{font:500 10px/1 var(--font-mono);color:var(--text-faint)}</style></head>
<body>
<div class="c"><div class="bar" style="height:var(--space-1)"></div><span class="l">1·4</span></div>
<div class="c"><div class="bar" style="height:var(--space-2)"></div><span class="l">2·8</span></div>
<div class="c"><div class="bar" style="height:var(--space-3)"></div><span class="l">3·12</span></div>
<div class="c"><div class="bar" style="height:var(--space-4)"></div><span class="l">4·16</span></div>
<div class="c"><div class="bar" style="height:var(--space-6)"></div><span class="l">6·24</span></div>
<div class="c"><div class="bar" style="height:var(--space-8)"></div><span class="l">8·32</span></div>
<div class="c"><div class="bar" style="height:var(--space-12)"></div><span class="l">12·48</span></div>
<div class="c"><div class="bar" style="height:var(--space-16)"></div><span class="l">16·64</span></div>
</body></html>
