<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-app);font-family:var(--font-sans);padding:24px;display:flex;gap:10px}
.sw{flex:1;height:96px;border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:10px;box-shadow:var(--hairline)}
.sw span{font:600 11px/1 var(--font-mono);color:rgba(0,0,0,.55)}</style></head>
<body>
<div class="sw" style="background:var(--emerald-700)"><span>700</span></div>
<div class="sw" style="background:var(--emerald-600)"><span>600</span></div>
<div class="sw" style="background:var(--emerald-500)"><span>500 · primary</span></div>
<div class="sw" style="background:var(--emerald-400)"><span>400 · accent</span></div>
<div class="sw" style="background:var(--emerald-300)"><span>300</span></div>
</body></html>
